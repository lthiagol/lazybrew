name: stable-ci

on:
  push:
    branches: [stable]
    # Tag convention: git tag = v<semver>, package version = <semver>.
    # Pre-releases use bare rcN (not rc.N): v1.0.0-rc1 / 1.0.0-rc1.
    # Filter is 'v*' — a tag without the v prefix will not fire this workflow.
    tags: ['v*']
  pull_request:
    branches: [stable]
  workflow_dispatch:

jobs:
  ci:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          if [ "$(gofmt -l . | wc -l)" -ne 0 ]; then
            echo "Files needing gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -count=1

      - name: go build
        run: go build -o /dev/null ./cmd/lazybrew
